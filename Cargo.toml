[package]
name = "netinspect"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Read-only network diagnostics for macOS: configuration, reachability, public address"
license = "MIT"
repository = "https://github.com/pottom/netinspect"

[lib]
name = "netinspect"
path = "src/lib.rs"

[[bin]]
name = "netinspect"
path = "src/main.rs"

[dev-dependencies]
insta = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
serde_json = "1"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
hickory-resolver = "0.26"
jiff = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "charset", "http2"] }
supports-color = "3"
termbg = "0.6"
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["net"] }
objc2 = "0.6"
objc2-core-wlan = { version = "0.3", features = ["CWInterface", "CWWiFiClient", "CoreWLANTypes"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
plist = "1.10"
system-configuration = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
