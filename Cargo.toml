[package]
name = "netinspect"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Read-only network diagnostics for macOS: configuration, reachability, public address"
license = "MIT"
repository = "https://github.com/pottom/netinspect"

[lib]
name = "netinspect"
path = "src/lib.rs"

[[bin]]
name = "netinspect"
path = "src/main.rs"

[dev-dependencies]
insta = "1"
minisign = "0.9"
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
serde_json = "1"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
hickory-resolver = "0.26"
flate2 = "1"
libc = "0.2"
jiff = "0.2"
minisign-verify = "0.2"
# rustls' default crypto provider is aws-lc-rs, a large bundled C library.
# `ring` does the same job here — two TLS clients talking to two hosts — for a
# fraction of the size. HTTP/1.1 is enough for both of them.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "webpki-roots", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
supports-color = "3"
tar = "0.4"
termbg = "0.6"
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
nix = { version = "0.31", features = ["net"] }
objc2 = "0.6"
objc2-core-wlan = { version = "0.3", features = ["CWInterface", "CWWiFiClient", "CoreWLANTypes"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
plist = "1.10"
system-configuration = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
